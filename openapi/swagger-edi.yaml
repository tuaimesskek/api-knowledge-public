      summary: >-
        Подписать документ
      operationId: >-
        Подписать документ
      description: |-
        Подписание формализованных и неформализованных документов. Формализованный документ .xml не может быть подписан если он является __черновиком__ или __фейковым (fake = true)__
        . Документ не может быть подписан если документооборот завершен для указанной стороны. 
        
          __Метод доступен если пользователь__:
        
           - авторизован;
           - имеет доступ к компании с указанным ИНН/КПП;
           - у пользователя есть право `CUSTOMER_EDI_STATE_REGISTRY` или `SUPPLIER_EDI_STATE_REGISTRY`;
           - имеет доступ к ЭДО-документу с указанным ID.
           - имеет доступ к ЭДО-провайдера по указанному логину и паролю
        
        
         __Подписание формализованных .xml документов__:
        
         - статус документа должен позволять подписание (черновик, аннулированный, отказной документ нельзя подписать) 
        
         - при подписании инициатором СЧФ, УПД, УКД необходимо приложить валидную подпись __xmlSignature__. 
         Подпись формирует пользователь к .xml документу
        
         - при подписании получателем СЧФ, УПД с функцией СЧФ или СЧФДОП, УКД с функцией КСЧФ или КСЧФДИС необходимо приложить извещение __invoiceReceipt__ и валидную подпись к нему __signature__.
         Извещение и подпись формирует пользователь.
        
         - при подписании получателем УПД с функцией ДОП или СЧФДОП и УКД с функцией ДИС или КСЧФДИС необходимо приложить титул покупателя __utdBuyerTitle__ и валидную подпись к нему __titleSignature__.
         Титул и подпись формирует пользователь. 
        
        
         __Подписание остальных документов__:
        
         - статус документа должен позволять подписание (аннулированный, отказной документ нельзя подписать) 
        
         - необходимо приложить файл подписи документа __signature__. Подпись формирует пользователь.
      tags:
        - ЭДО
      parameters:
        - name: ZakupayToken
          in: header
          description: e.g. <TOKEN_VALUE>
          required: false
          example: <TOKEN_VALUE>
          schema:
            type: string
        - name: id
          in: query
          description: идентификатор документа
          required: true
          example: 2395
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                login:
                  type: string
                  description: логин пользователя от ЭДО-провайдера
                password:
                  type: string
                  description: пароль пользователя от ЭДО-провайдера
                signerInn:
                  type: string
                  description: ИНН компании подписанта
                signerKpp:
                  type: string
                  description: КПП компании подписанта
                powerOfAttorneyUseDefault:
                  type: boolean
                  description: значение true означает, что для этого документа используется МЧД по умолчанию, настроенное на стороне пользователя в ЭДО-провайдере. Значение false означает, что МЧД будет передано по ИНН доверителя и регистрационному номеру доверенности. Если значение в запросе отсутствует, то МЧД не используется.
                powerOfAttorneyIssuerInn:
                  type: string
                  description: ИНН доверителя из МЧД. Значение используется для передачи МЧД по fullId(https://developer.kontur.ru/docs/diadoc-api/proto/PowerOfAttorneyFullId.html). Первая часть fullId. Должен указываться вместе с powerOfAttorneyRegNum и powerOfAttorneyRepresentativeInn.
                powerOfAttorneyRegNum:
                  type: string
                  description: регистрационный номер МЧД. Значение используется для передачи МЧД по fullId(https://developer.kontur.ru/docs/diadoc-api/proto/PowerOfAttorneyFullId.html). Вторая часть fullId. Должен указываться вместе с powerOfAttorneyIssuerInn и powerOfAttorneyRepresentativeInn.
                powerOfAttorneyRepresentativeInn:
                  type: string
                  description: ИНН представителя из МЧД. Значение используется для передачи МЧД по fullId(https://developer.kontur.ru/docs/diadoc-api/proto/PowerOfAttorneyFullId.html). Третья часть fullId. Должен указываться вместе с powerOfAttorneyIssuerInn и powerOfAttorneyRegNum.
                invoiceReceipt:
                  type: string
                  format: byte
                  description: файл извещения
                signature:
                  type: string
                  format: byte
                  description: файл подписи извещения, либо неформализованных документов
                xmlSignature:
                  type: string
                  format: byte
                  description: файл подписи формализованного документа
                titleSignature:
                  type: string
                  format: byte
                  description: файл подписи титула
                utdBuyerTitle:
                  type: string
                  format: byte
                  description: файл титула
              required:
                - login
                - password
                - signerInn
                - signerKpp
              example:
                login: login
                password: password
                signerInn: 1234567890
                signerKpp: 123456789
                signature: file.sign
