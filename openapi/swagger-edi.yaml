                  description: Новый ИНН третьей стороны ЭДО.
                thirdPartyKpp:
                  type: string
                  description: Новый КПП третьей стороны ЭДО.
              required:
                - thirdPartyInn
                - thirdPartyKpp
              example:
                thirdPartyInn: '1234567890'
                thirdPartyKpp: '123456789'

