openapi: 3.0.0
info:
  title: API портала «Закупай»
  version: Edi
  description: >-
    
    ## Аутентификация и авторизация


    Для аутентификации запросов к API нужно задать HTTP-заголовок `ZakupayToken`
    и указать значение, которое можно получить в личном кабинете пользователя на
    вкладке ["Безопасность"](https://zakupay.sel-be.ru/core/cabinet/password) в
    разделе "Токены для приложений, интегрированных с порталом".


    Для авторизации запросов пользователь, чей токен используется, должен иметь
    соответствующие права для выполнения соответствующей операции. Права могут
    быть выданы администратором компании, в которой работает пользователь, или
    администратором площадки «Закупай».


    Далее в описании методов API под словом `Пользователь` будет пониматься
    пользователь, чей токен используется в запросе к методу API.


    **Важно:**

    - Адрес для заказчика: `https://[ИМЯ ВАШЕЙ СИНТЕКИ].cynteka.ru` (например, `https://test.cynteka.ru/api/v1/offers`)
    
    - Адрес для поставщика: `https://prodavay.sel-be.ru`


    ## Безопасность
     Использование `https` обязательно. Иначе ответ от сервера всегда будет `301
    Moved Permanently` с редиректом на запрошенный `url`, но по `https`. При
    этом если при выполнении запроса будет настроено автоматическое следование
    редиректам, то метод всегда будет меняться на `GET`, а тело запроса будет
    теряться, что приведёт к некорректной работе API.


    Для запросов к методам API всегда используйте `https` в целях безопасности и
    сохранности Вашего токена. В случае если Вы сомневаетесь в
    конфиденциальности Вашего токена, то в любой момент в личном кабинете Вы
    можете деактивировать токен, после чего запросы с его использованием
    перестанут выполняться.


    Потеря токена не может повлечь за собой утрату контроля над Вашей учётной
    записью, т.к. методы, которые доступны с использованием токена, ограничены и
    не позволяют менять учётные данные пользователя<a
    name="response-format">.</a>


    ## Формат ответа


    Методы API поддерживают два формата ответа: `json` и `xml` (если в описании
    метода не указано иного). Формат `json` является форматом по умолчанию. Для
    получения ответа в этом формате никаких действий предпринимать не нужно. Для
    получения ответа в формате `xml` нужно задать `GET` параметр `format` со
    значением `xml`, либо задать `HTTP` заголовок `Accept` со значением
    `text/xml` или `application/xml`. Сначала проверяется значение `HTTP`
    заголовка `Accept`, если оно имеет значение, которое не учитывается API, то
    берётся значение `GET` параметра.


    Любые некорректные или недопустимые значения `GET` параметра `format` или
    `HTTP` заголовка `Accept` игнорируются, а формат ответа в таком случае
    принимается как `json`.


    Для обозначения `null` значений в `xml` используются самозакрывающиеся тэги
    с атрибутом `xsi:nil="true"`. Пустая строка при этом будет представлена
    парой тэгов (открывающимся и закрывающимся) с отсутствием чего либо внутри.
    Например:


    ```xml

    ...
        <responsible xsi:nil="true" />
        <creator>
            <lastName>Иванов</lastName>
            <firstName></firstName>
            <middleName xsi:nil="true" />
        </creator>
    ...

    ```


    Примеры ответов API в данной документации приведены в формате `json`<a
    name="date-format">.</a>


    ## Формат представления дат


    Формат представления дат имеет значение как в случае передачи данных методам
    API, так и в случае получения ответа от методов API.


    Методы API поддерживают два формата представления дат при получении и в
    ответах: `ISO 8601` и `Unix time`.


    ### При передаче дат методам API


    При передаче дат методам API в формате `ISO 8601` поддерживаются следующие
    шаблоны в порядке их применения:


    - `yyyy-MM-dd HH:mm:ss`


    - `yyyy-MM-ddTHH:mm:ss`


    - `yyyy-MM-dd HH:mm`


    - `yyyy-MM-ddTHH:mm`


    - `yyyy-MM-dd`


    Вместе с этими шаблонами может использоваться любой из трёх форматов
    представления часового пояса:


    - `General time zone`


    - `RFC 822`


    - `ISO 8601`


    как описано
    [здесь](http://docs.oracle.com/javase/8/docs/api/java/text/SimpleDateFormat.html#timezone).
    Часовой пояс указывать необязательно, в этом случае будет использован
    часовой пояс сервера (см. ниже). Если же часовой пояс указывается, то либо
    сразу после даты, либо через пробел после даты. Например, `2017-02-12
    12:34+0800` или `2017-02-12 12:34 +0800`.


    >В случае передачи даты в GET параметре формат `ISO 8601`-`yyyy-MM-dd`
    является единственно допустимым, если не указано иначе в описании
    конкретного метода API.


    При передаче дат методам API в формате `Unix time` поддерживаются два
    варианта:


    - число, представляющее количество миллисекунд, прошедших с момента 1го
    января `1970` года `00:00:00.000` по `UTC`


    - число, представляющее количество секунд, прошедших с момента 1го января
    `1970` года `00:00:00.000` по `UTC`


    Например, `1486892052168` или `1486892052`.


    При передаче дат методам API можно использовать разные форматы одновременно
    для разных полей с датами.


    ### При получении дат в ответах от методов API


    По умолчанию используется формат `Unix time`. При этом представление идёт в
    виде количества миллисекунд. Например, `1486892052168`.


    Чтобы получить дату в формате `ISO 8601`, необходимо задать `GET` параметр
    `isoDate`, значение игнорируется, достаточно наличия параметра. Даты будут
    представлены строкой в формате `yyyy-MM-ddTHH:mm:ss.SSSZ`, например,
    `2017-02-12T12:34:12.168+0300`.


    При получении ответа от методов API все поля с датами (если в описании поля
    явно не указан формат представления даты) будут представлены в выбранном
    формате.


    ### Часовой пояс


    В случае если локальное время, в котором работает интеграционное решение,
    отличается от московского времени, то при передаче дат методам API для их
    корректной обработки и отображения всем пользователям портала «Закупай»
    необходимо использовать формат `Unix time`, либо `ISO 8601` совместо с
    указанием часового пояса. В случае использования формата `ISO 8601` без
    указания часового пояса заданная дата и время будут интерпретированы в
    рамках московсого времени. Это может привести к дезинформации пользователей
    портала «Закупай».


    ## HTTP-коды ответов и общие поля ответов


    В случае успешного выполнения запроса к методу API ответ от сервера будет
    `200 OK`, в случае ошибок могут быть возвращены ответы `400 Bad Request`,
    `401 Unauthorized`, `403 Forbidden`, `404 Not Found`, `500 Internal Server
    Error`.


    В зависимости от успеха выполнения запроса в общем случае ответ будет
    содержать следующие данные:


    - `result` - флаг успешности выполнения запроса.<br/>Принимает два значения
    `true` - в случае успешного выполнения запроса, `false` - в случае каких-то
    ошибок выполнения запроса. При использовании API успех выполнения операции
    можно определять по `HTTP` коду ответа: `200` - успешное выполнение, иначе -
    неудачное выполнение, либо по флагу `result` в ответе. Будет присутствовать
    в ответе API при любом результате выполнения запроса.


    - `errorMessage` - сообщение о произошедшей ошибке.<br/>Будет присутствовать
    в ответе API только в случае неудачного выполнения запроса.


    В некоторых случаяx при неудачном выполнении запроса ответ может
    дополнительно содержать в себе коллекцию `errors`. Эта коллекция содержит в
    себе детальные описания произошедших ошибок, и если это имеет место, то путь
    до данных в структуре `json`, которые вызвали ошибку. Например:


    ```

    {
      "result": false,
      "errorMessage": "Валидация данных завершилась с ошибками.",
      "errors": [
         {
           "errorMessage": "Коллекция данных о файлах содержит пустые значения.",
           "path": "files[1]"
         },
         ...
      ]
    }

    ```


    ## Иерархии компаний


    Портал «Закупай» позволяет пользователям создавать иерархии подчинения
    компаний. Доступ к любым данным на портале всегда идёт в рамках той иерархии
    компаний, которой принадлежит пользователь. При этом пользователи компании,
    которая в иерархии находится выше, при наличии соответствующих прав могут
    иметь доступ к данным компании, которая является дочерней к этой компании.
    Обратное не верно, кроме случаев, когда это указано явно.


    Т.е. если в описании сказано, что те или иные данные должны принадлежать
    иерархии компаний, которой принадлежит пользователь, то под этим нужно
    понимать, что данные должны принадлежать компании пользователя или
    компаниям, которые являются дочерними по отношению к компании пользователя.
