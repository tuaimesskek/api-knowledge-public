      summary: Удалить ЭДО-документ
      operationId: Удалить ЭДО-документ
      description: >-
        Удаляет ЭДО-документ с заданным идентификатором, а также все его
        дочерние документы.


        Ответ содержит список удаленных ЭДО-документов.
        
        
        __Документ можно удалить если__: 
          - документ является черновиком (ediId == null)
          - документ является фейковым
          - документ не удален 
          - дочерние документы могут быть удалены


         __Метод доступен если пользователь__:

        - авторизован;
        
        - имеет доступ к системе;
        
        - состоит в какой-либо компании;
        
        - у пользователя есть право `SUPPLIER_EDI_STATE_DELETE` или `EDI_DELETE`;

        - имеет доступ к ЭДО-документу с указанным ID.
        
        
        При удалении документа, подписанного на бумаге (isSignedOnPaper = true), необходимо право `ZAKUPAY_EDI_GENERATOR`

      tags:
        - ЭДО
      parameters:
        - name: id
          in: path
          description: ID ЭДО-документа.
          required: true
          example: '91'
          schema:
            type: number
        - name: isoDate
          in: query
          description: >
            Если параметр isoDate присутвует в запросе, даты в ответе будут
            представлены в формате *ISO 8601*.

            Любые значения параметра игнорируются, достаточно наличия параметра
            (см. [Формат представления дат](#date-format)).
          required: false
          schema:
            type: string
        - name: format
          in: query
          description: >
            Формат ответа.

            Любые недопустимые значения параметра игнорируются и используется
            `json` (см. [Формат ответа](#response-format)).
          required: false
          example: xml
          schema:
            type: string
            enum:
              - json
