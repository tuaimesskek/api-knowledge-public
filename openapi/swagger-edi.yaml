      summary: Обновление состояния документа счета в ЭДО
      operationId: Обновление состояния документа счета в ЭДО
      description: >-
        Метод для обновления документа счёта в ЭДО. Пользователь должен иметь право `OFFERS` для работы со счетами
      tags:
        - ЭДО
      parameters:
        - name: offerId
          in: path
          description: 'ID счёта, которому принадлежит состояние документа счёта в ЭДО.'
          required: true
          example: '845'
          schema:
            type: number
        - name: offerDocumentId
          in: path
          description: 'ID документа счёта, которому принадлежит состояние документа в ЭДО.'
          required: true
          example: '7214'
          schema:
            type: number
        - name: ediStateId
          in: path
          description: ID ЭДО документа
          required: true
          example: 184
          schema:
            type: integer
            format: int64
        - name: format
          in: query
          description: >

            Возможность задать формат ответа API через `GET` параметр. Любые
            недопустимые значения параметра игнорируются и используется `json`
            (см. [Формат ответа](#response-format)).
          required: false
          example: xml
          schema:
            type: string
            enum:
              - json
              - xml
            default: json
        - name: isoDate
          in: query
          description: >
            Если параметр isoDate присутвует в запросе, даты в ответе будут
            представлены в формате *ISO 8601*.

            Любые значения параметра игнорируются, достаточно наличия параметра
            (см. [Формат представления дат](#date-format)).
          required: false
          schema:
            type: string
        - name: ZakupayToken
          in: header
          description: e.g. TOKEN_VALUE
          required: false
          example: TOKEN_VALUE
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                signatureStatus:
                  type: string
                  description: >-
                    Альтернативный строковый Id статуса подписей документа в ЭДО
                    (см. [Справочник статусов подписей
                    документа](#edi-state-signature-statuses-refbook)).
                revocationStatus:
                  type: string
                  description: >-
                    Альтернативный строковый Id статуса аннулирования документа
                    в ЭДО (см. [Справочник статусов аннулирования
                    документа](#edi-state-revocation-statuses-refbook)).
                resolutionStatus:
                  type: string
                  description: >-
                    Альтернативный строковый Id статуса согласования документа в
                    ЭДО на стороне покупателя (см. [Справочник статусов
                    согласования
                    документа](#edi-state-resolution-statuses-refbook)).
                signatureDate:
                  type: number
                  description: >-
                    Дата подписания документа в ЭДО покупателем. В формате
                    *Unix time* или *ISO 8601*(см. [Формат представления
                    дат](#date-format)).
              required:
                - signatureStatus
                - revocationStatus
                - resolutionStatus
              additionalProperties: false
              example:
                signatureStatus: InboundWaitingForRecipientSignature
                revocationStatus: RevocationStatusNone
                resolutionStatus: OutboundWaitingForResolution
                signatureDate: '2016-12-19'
