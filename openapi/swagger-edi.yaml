      summary: Получить реестр состояний ЭДО-документов для покупателя
      operationId: Получить реестр состояний ЭДО-документов для покупателя
      description: >-
        Пользователь, пытающийся получить список состояний документов в ЭДО,
        должен иметь право `CUSTOMER_EDI_STATE_REGISTRY` для работы с реестром
        состояний документов в ЭДО.
        
        
        Чтобы видеть документы всей иерархии компании пользователя, нужно иметь право `ZAKUPAY_EDI_STATE_VIEW_ALL_IN_COMPANY`. Без этого права пользователю будут доступны документы своей компании и дочерних подразделений.
        
        
        Метод предоставляет возможность запрашивать коллекцию состояний
        документов в ЭДО постранично, контролируя номер и размер запрашиваемой
        страницы. Также доступны различные способы по фильтрации состояний<a
        name="edi-state-update">.</a>
      tags:
        - ЭДО
      parameters:
        - name: page
          in: query
          description: >

            Номер страницы, данные с которой нужно вернуть. Если не задан, то по
            умолчанию будет возвращена первая страница данных.
          required: false
          example: '1'
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          description: >

            Размер страницы. Максимальное значение 100. Если не задано или
            задано некорректно, то будет принято как 10 или 100 в зависимости от
            ситуации.
          required: false
          example: '15'
          schema:
            type: number
            default: 10
        - name: documentType
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            типу документа. Можно указать сразу несколько значений
            *?...documentType=UTD&documentType=TTN...*. Для получения набора
            значений, которые можно указывать в данном фильтре обратитесь к
            методу [справочник типов документа
            счёта](#offer-document-types-refbook).
          required: false
          example: '2'
          schema:
            type: string
        - name: customer
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            покупателю. В качестве значения параметра указывается **id**
            компании покупателя. Можно указать сразу несколько значений
            *?...customer=3242&customer=8544...*. Для получения набора значений,
            которые можно указывать в данном фильтре обратитесь к методу
            [справочник компаний покупателей для реестра состояний документов в
            ЭДО](#edi-state-customers-refbook).
          required: false
          example: '3242'
          schema:
            type: number
        - name: supplier
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            поставщику. В качестве значения параметра указывается **id**
            компании поставщика. Можно указать сразу несколько значений
            *?...supplier=21354&supplier=841...*. Для получения набора значений,
            которые можно указывать в данном фильтре обратитесь к методу
            [справочник компаний поставщиков для реестра состояний документов в
            ЭДО](#edi-state-suppliers-refbook).
          required: false
          example: '21354'
          schema:
            type: number
        - name: responsible
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            ответственному по заявке. В качестве значения указывается *id* пользователя. Можно указать сразу несколько значений  *?...responsible=2&responsible=3...*.
          required: false
          example: '64'
          schema:
            type: integer
            format: int64
        - name: offerId
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            счёту документа. В качестве значения параметра указывается **id**
            счёта. Допустимо указывать только одно значение.
          required: false
          example: '3645'
          schema:
            type: number
        - name: orderId
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            заявке, к которой относится счёт документа. В качестве значения
            параметра указывается **id** заявки. Допустимо указывать только одно
            значение.
          required: false
          example: '87451'
          schema:
            type: number
        - name: amountFrom
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО,
            сумма которых больше или равна заданной. Принимаются только числовые
            значения. Дробная часть от целой отделяется точкой, а не запятой.
            Можно отправлять целые числа без дробной части. Допустимо указывать
            только одно значение.
          required: false
          example: '5000'
          schema:
            type: number
        - name: amountTo
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО,
            сумма которых меньше или равна заданной. Принимаются только числовые
            значения. Дробная часть от целой отделяется точкой, а не запятой.
            Можно отправлять целые числа без дробной части. Допустимо указывать
            только одно значение.
          required: false
          example: '10000'
          schema:
            type: number
        - name: ttnNumber
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            номеру ТТН. Допустимо указывать только одно значение.
          required: false
          example: 123/23
          schema:
            type: string
        - name: documentDateFrom
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, что имеют дату документа в заданную дату или после неё.
            Значение передавать в формате *ISO 8601* в виде *yyyy-MM-dd*.
            Допустимо указывать только одно значение.
          required: false
          example: '2016-12-15'
          schema:
            type: string
        - name: documentDateTo
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, что имеют дату документа в заданную дату или до неё. Значение
            передавать в формате *ISO 8601* в виде *yyyy-MM-dd*. Допустимо
            указывать только одно значение.
          required: false
          example: '2016-12-25'
          schema:
            type: string
        - name: customerSignatureDateFrom
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, что имеют дату подписания документа покупателем в заданную дату
            или после неё. Значение передавать в формате *ISO 8601* в виде
            *yyyy-MM-dd*. Допустимо указывать только одно значение.
          required: false
          example: '2016-12-15'
          schema:
            type: string
        - name: customerSignatureDateTo
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, что имеют дату подписания документа покупателем в заданную дату
            или до неё. Значение передавать в формате *ISO 8601* в виде
            *yyyy-MM-dd*. Допустимо указывать только одно значение.
          required: false
          example: '2016-12-25'
          schema:
            type: string
        - name: supplierSignatureDateFrom
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, что имеют дату подписания документа поставщиком в заданную дату
            или после неё. Значение передавать в формате *ISO 8601* в виде
            *yyyy-MM-dd*. Допустимо указывать только одно значение.
          required: false
          example: '2016-12-15'
          schema:
            type: string
        - name: supplierSignatureDateTo
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, что имеют дату подписания документа поставщиком в заданную дату
            или до неё. Значение передавать в формате *ISO 8601* в виде
            *yyyy-MM-dd*. Допустимо указывать только одно значение.
          required: false
          example: '2016-12-25'
          schema:
            type: string
        - name: isFinished
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, для которых документооборот был завершён. Фильтр имеет место
            быть только при значении **true**. Значение **false** игнорируется и
            не влияет на выборку.
          required: false
          example: 'true'
          schema:
            type: boolean
            enum:
              - true
        - name: isApplied
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            статусу приёмки документа. Фильтр имеет место быть при значениях
            **true** - документ был принят, **false** - документ не был принят,
            **null** - документ ещё не принимался. Можно указать сразу несколько
            значений *?...isApplied=false&isApplied=null...*.
          required: false
          example: 'true'
          schema:
            type: boolean
            nullable: true
            enum:
              - true
              - false
              - null
        - name: signatureStatus
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            статусу подписей документа. В качестве значения параметра
            указывается **id** статуса подписей документа. Можно указать сразу
            несколько значений *?...signatureStatus=23&signatureStatus=12...*.
            Для получения набора значений, которые можно указывать в данном
            фильтре обратитесь к методу [справочник статусов подписей
            документа](#edi-state-signature-statuses-refbook).
          required: false
          example: '23'
          schema:
            type: string
        - name: revocationStatus
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            статусу аннулирования документа. В качестве значения параметра
            указывается **id** статуса аннулирования документа. Можно указать
            сразу несколько значений
            *?...revocationStatus=43&revocationStatus=33...*. Для получения
            набора значений, которые можно указывать в данном фильтре обратитесь
            к методу [справочник статусов аннулирования
            документа](#edi-state-revocation-statuses-refbook).
          required: false
          example: '43'
          schema:
            type: string
        - name: resolutionStatus
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            статусу согласования документа. В качестве значения параметра
            указывается **id** статуса согласования документа. Можно указать
            сразу несколько значений
            *?...resolutionStatus=67&resolutionStatus=53...*. Для получения
            набора значений, которые можно указывать в данном фильтре обратитесь
            к методу [справочник статусов согласования
            документа](#edi-state-resolution-statuses-refbook).
          required: false
          example: '67'
          schema:
            type: string
        - name: ZakupayToken
          in: header
          description: e.g. TOKEN_VALUE
          required: true
          example: TOKEN_VALUE
          schema:
            type: string
