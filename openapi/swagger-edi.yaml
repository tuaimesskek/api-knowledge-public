      summary: Создать ЭДО-документы на основе документов в системе ЭДО-провайдера
      operationId: Создать ЭДО-документы на основе документов в системе ЭДО-провайдера
      description: >-
        Метод для создания ЭДО-документов.

        Поддерживает создание ЭДО-документов, уже существующих в системе
        ЭДО-провайдера. При загрузке УПД для поставщика обязательно указание параметра `offerId`, а для покупателя обязательно указание либо параметра `offerId`, либо параметра `portalOfferId`.

      tags:
        - ЭДО
      parameters:
        - name: ZakupayToken
          in: header
          description: e.g. <TOKEN_VALUE>
          required: true
          example: <TOKEN_VALUE>
          schema:
            type: string
        - name: Content-Type
          in: header
          description: ' без application/json ведет себя как POST /api/v1/edi/send'
          required: true
          example: application/json
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                providerCredentials:
                  type: object
                  properties:
                    login:
                      type: string
                      description: Логин от ЭДО-провайдера
                    password:
                      type: string
                      description: Пароль от ЭДО-провайдера
                  required:
                    - login
                    - password
                  description: Данные для аутентификации в системе ЭДО-провайдера.
                newEdiStates:
                  type: array
                  description: >-
                    Список новых ЭДО-документов. Без данного параметра метод
                    ведет себя POST /api/v1/edi/send
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Тип ЭДО документа в Синтеке
                      parentId:
                        type: integer
                        format: int64
                        description: Идентификатор родителя в Синтеке
                      ediId:
                        type: string
                        description: Идентификатор документа в ЭДО-провайдере
                        maxLength: 72
                        minLength: 72
                      externalId:
                        type: string
                        description: внешний идентификатор
                      additionalData:
                        type: string
                        description: дополнительная информация в формате JSON
                      offerId:
                        type: integer
                        format: int64
                        description: в случае загрузки УПД (UTD), необходимо привязать ее к счету. В качестве значения указывается идентификатор счета
                      portalOfferId:
                        type: integer
                        format: int64
                        description: в случае загрузки УПД (UTD), можно привязать ее к счету по id портала
                      additionalDocumentType:
                        type: string
                        description: обязательный параметр в случае загрузки УПД. В качестве значения указывается название типа
                        enum:
                          - Материал
                          - Услуги
                          - Возмещение
                          - Генуслуги
                      projectId:
                        type: integer
                        format: int64
                        description: в случае загрузки Договора подряда (WORK_CONTRACT), можно привязать его к проекту. В качестве значения указывается идентификатор проекта
                      correctedDocumentId:
                        type: integer
                        format: int64
                        description: >-
                          Идентификатор корректируемого документа.
                          Корректируемый документ должен быть того же
                          направления, типа,  что и корректировочный; в случае,
                          если корректировочный документ - СЧФ, у
                          корректируемого документа должно быть запрошено
                          аннулирование; родительский документ у корректируемой
                          СЧФ и корректировочного документа должен совпадать.
                      correctedExternalDocumentId:
                        type: integer
                        format: int64
                        description: >-
                          Внешний идентификатор корректируемого документа.
                          Корректируемый документ должен быть того же
                          направления, типа,  что и корректировочный; в случае,
                          если корректировочный документ - СЧФ, у
                          корректируемого документа должно быть запрошено
                          аннулирование; родительский документ у корректируемой
                          СЧФ и корректировочного документа должен совпадать.
                      isInitiatorCustomer:
                        type: boolean
                        description: ' true - при отправке договора инициатор является заказчиком в договоре. По умолчанию при отправке договора инициатор считается исполнителем, а получатель заказчиком. Соответветственно, чтобы добиться обратного, у договора нужно выставить этот флаг. Только для Договора подряда или Договора поставки (WORK_CONTRACT, SUPPLY_CONTRACT).'
                    required:
                      - type
                      - ediId
              required:
                - providerCredentials
                - newEdiStates
              example:
                providerCredentials:
                  login: login
                  password: password
                newEdiStates:
                  - type: UTD
                    ediId: >-
                      911f338d-40ab-4ea6-91ba-ed24a97aac118917c78d-dde2-49c9-92f9-3aedc54bc980
                    offerId: 1
                    portalOfferId: 23423
                    parentId: 1
                    externalId: "1234567890"
  /edi/send:
    post:
      summary: Отправка подписанных или неподписанных документов ЭДО-провайдеру
      operationId: Отправка подписанных или неподписанных документов в ЭДО-провайдеру
      description: >-
        Метод отправляет документы в систему Эдо-провайдера. 
        
        
        __Метод доступен если__:


        - в системе ЭДО-провайдера есть доступ к компании отправителя или
        получателя;


        - в системе ЭДО-провайдера существует возможность обмениваться
        документами  между указанными компаниями;


        - у пользователя есть право `CUSTOMER_EDI_STATE_REGISTRY` ИЛИ
        `SUPPLIER_EDI_STATE_REGISTRY`;


        - у пользователя есть головное право работы с выбранным типом документа.
        При прикреплении дочерних документов необходимо право головного
        документа.


        `documents[x]` - данные о документе, где х - порядковый номер документа
        (напр. documents[0]). document[x].content для формализованных документов
        должен быть в формате json. Для УПД может быть строго в формате по
        приказу ФНС № 820 (см. https://www.diadoc.ru/docs/forms/upd/structure/8).
        
        
        В случае загрузки дополнительных документов к __договору оказания услуг__ дополнительно будет проверяться:
        наличие параметра offerId, существование счёта с заданным offerId, согласованность счёта,
        совпадение ИНН поставщика в счете и ИНН компании текущего пользователя.
      tags:
        - ЭДО
      parameters:
        - name: ZakupayToken
          in: header
          description: e.g. <TOKEN_VALUE>
          required: true
          example: <TOKEN_VALUE>
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              allOf:
                - $ref: '#/components/requestBodies/ediSendData'
              properties:
                'documents[x].content':
                  type: string
                  format: byte
                  description: >-
                    файл документа. Для формализованных документов должен быть в
                    формате json. Для УПД может быть строго в формате по приказу
                    ФНС № 820 (см.
                    https://www.diadoc.ru/docs/forms/upd/structure/8). Также для УПД может быть .zip архив с файлом .json внутри, название файла .json должно начинаться с "UTD" (например - UTD_3456.json, UTD.json, UTD5847476949.json)
                'documents[x].signature':
                  type: string
                  format: byte
                  description: файл подписи документа
                'documents[x].powerOfAttorneyUseDefault':
                  type: boolean
                  description: значение true означает, что для этого документа используется МЧД по умолчанию, настроенное на стороне пользователя в ЭДО-провайдере. Значение false означает, что МЧД будет передано по ИНН доверителя и регистрационному номеру доверенности. Если значение в запросе отсутствует, то МЧД не используется.
                'documents[x].powerOfAttorneyIssuerInn':
                  type: string
                  description: ИНН доверителя из МЧД. Значение используется для передачи МЧД по fullId(https://developer.kontur.ru/docs/diadoc-api/proto/PowerOfAttorneyFullId.html). Первая часть fullId. Должен указываться вместе с powerOfAttorneyRegNum и powerOfAttorneyRepresentativeInn.
                'documents[x].powerOfAttorneyRegNum':
                  type: string
                  description: регистрационный номер МЧД. Значение используется для передачи МЧД по fullId(https://developer.kontur.ru/docs/diadoc-api/proto/PowerOfAttorneyFullId.html). Вторая часть fullId. Должен указываться вместе с powerOfAttorneyIssuerInn и powerOfAttorneyRepresentativeInn.
                'documents[x].powerOfAttorneyRepresentativeInn':
                  type: string
                  description: ИНН представителя из МЧД. Значение используется для передачи МЧД по fullId(https://developer.kontur.ru/docs/diadoc-api/proto/PowerOfAttorneyFullId.html). Третья часть fullId. Должен указываться вместе с powerOfAttorneyIssuerInn и powerOfAttorneyRegNum.
                'documents[x].type':
                  type: string
                  description: тип документа в Синтеке
                'documents[x].amount':
                  type: integer
                  description: сумма по документу
                'documents[x].date':
                  type: string
                  description: дата документа в формате ДД.ММ.ГГГГ. (дата должна быть в диапазоне 01.01.1900 - 31.12.2099 включительно)
                'documents[x].number':
                  type: string
                  description: номер документа
                'documents[x].offerId':
                  type: integer
                  format: int64
                  description: идентификатор счета к которому прикрепляется документ
                'documents[x].projectId':
                  type: integer
                  format: int64
                  description: идентификатор проекта к которому прикрепляется документ
                'documents[x].correctedDocumentId':
                  type: integer
                  format: int64
                  description: >-
                    идентификатор корректируемого документа. Корректируемый
                    документ должен быть того же направления, типа,  что и
                    корректировочный; в случае, если корректировочный документ -
                    СЧФ, у корректируемого документа должно быть запрошено
                    аннулирование; родительский документ у корректируемой СЧФ и
                    корректировочного документа должен совпадать.
                'documents[x].correctedExternalDocumentId':
                  type: string
                  description: >-
                    внешний идентификатор корректируемого документа.
                    Корректируемый документ должен быть того же направления,
                    типа,  что и корректировочный; в случае, если
                    корректировочный документ - СЧФ, у корректируемого документа
                    должно быть запрошено аннулирование; родительский документ у
                    корректируемой СЧФ и корректировочного документа должен
                    совпадать.
                'documents[x].projectExternalId':
                  type: string
                  description: >-
                    внешний идентификатор проекта к которому привязывается
                    докумен
                'documents[x].externalId':
                  type: string
                  description: внешний идентификатор документа
                'documents[x].parentExternalId':
                  type: string
                  description: >-
                    внешний идентификатор родительского документа к которому
                    привязывается текущий докумен
                'documents[x].parent':
                  type: string
                  description: >-
                    родительский документ внутри запроса. Указывается по шаблону
                    documents[x]
                'documents[x].additionalData':
                  type: string
                  description: дополнительные данные документа в формате JSON
                'documents[x].isInitiatorCustomer':
                  type: boolean
                  description: >-
                    отвечает на вопрос: при отправке договора инициатор является
                    заказчиком в договоре? По умолчанию при отправке договора
                    инициатор считается исполнителем, а получатель заказчиком.
                    Соответветственно, чтобы добиться обратного, у договора
                    нужно выставить этот флаг. Только для Договора подряда или
                    Договора
                'documents[x].isFakeSigned':
                  type: boolean
                  description: >-
                    значение true означает, что данный документ должны быть
                    расценен как подписанный всеми сторонами и ЭДО-провайдеру
                    отправляться не должен. Необходимо право
                    `ZAKUPAY_EDI_STATE_FAKE_SIGNED`
                'documents[x].orderId':
                  type: integer
                  format: int64
                  description: 'в случае загрузки УПД, можно привязать ее к заявке'
                'documents[x].additionalDocumentType':
                  type: string
                  description:  >-
                    тип УПД. В качестве значения указывается название типа
                  enum:
                    - Материал
                    - Услуги
                    - Возмещение
                    - Генуслуги
                'documents[x].isApplied':
                  type: boolean
                  description:  >-
                    статус приёмки документа. Null если не принималась, true - принята, false - не принята.
                  enum:
                    - true
                    - false
              required:
                - initiatorInn
                - recipientInn
                - 'documents[x].content'
                - 'documents[x].type'

