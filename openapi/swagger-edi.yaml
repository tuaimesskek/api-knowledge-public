      summary: 'Обновить данные заданных документов из Диадока'
      operationId: 'Обновить данные заданных документов из Диадока'
      description: >-
        Метод обновления данных заданных документов из Диадока.
        
        
        Из указанных в теле запроса ЭДО-документов будут обновлены
        существующие документы к которым у текущего
        пользователя есть доступ. Документ не может обновиться если он является __черновиком__ или __фейковым (fake = true)__

        В теле ответа отсутствуют данные о дочерних документах.
        
        
        __Метод доступен если пользователь__:

        - авторизован;
        
        - имеет доступ к системе;
        
        - состоит в какой-либо компании;
        
        - у пользователя есть права `CUSTOMER_EDI_STATE_REGISTRY` или `SUPPLIER_EDI_STATE_REGISTRY`;

        - имеет доступ к ЭДО-документу с указанным ID.


      tags:
        - ЭДО
      parameters:
        - name: ZakupayToken
          in: header
          description: e.g. <TOKEN_VALUE>
          required: false
          example: <TOKEN_VALUE>
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  description: логин пользователя от ЭДО-провайдера
                password:
                  type: string
                  description: пароль пользователя от ЭДО-провайдера
                ediStateIds:
                  type: array
                  description: идентификаторы документов подлежащих обновлению.
                  items:
                    type: integer
                    format: int64
              required:
                - login
                - password
                - ediStateIds
              example:
                login: login
                password: password
                ediStateIds: [1,2,3]
