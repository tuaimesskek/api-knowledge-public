      parameters:
        - name: id
          in: path
          description: идентификатор документа
          required: true
          example: '346'
          schema:
            type: integer
            format: int64
        - name: ZakupayToken
          in: header
          description: e.g. <TOKEN_VALUE>
          required: false
          example: <TOKEN_VALUE>
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                externalId:
                  type: string
                  description: Новый внешний ID ЭДО-документа
              required:
                - externalId
              example:
                externalId: '123'
