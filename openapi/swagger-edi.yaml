      description: |-
        Меняет родительский документ
        
        __Сменить родительский документ можно если__:
        
        - у пользователя есть право `EDI_CHANGE_PARENT`
        
        - документ не указывает сам на себя
        
        - родительский документ существует в системе
        
        - родительский документ не удален и не аннулирован
        
        - родительский документ подходит по типу
        
        - документ не является корректировкой
        
        - отправитель, получатель, третья сторона совпадают у указанных документов в заданной степени строгости
