        inn:
          type: string
          description: ИНН организации
        kpp:
          type: string
          description: КПП организации
      required:
        - id
        - name
        - shortName
        - inn
        - kpp

    personName:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: идентификатор
        lastName:
          type: string
          description: фамилия
        firstName:
          type: string
          description: имя
        middleName:
          type: string
          description: отчество
        fullName:
          type: string
          description: ФИО (фамилия, имя, отчество)

    ediStateStatus:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: идентификатор
        alternateId:
          type: string
          description: статус
        name:
          type: string
          description: локализированная расшифровка статуса
        direction:
          type: string
          description: направление
          enum:
            - INBOUND
            - BOTH
            - OUTBOUND

    ediSendData:
      type: object
      properties:
        login:
          type: string
          description: >-
            логин пользователя от ЭДО-провайдера, если указано `isDraft
            = true`, то поле не обязательно
        password:
          type: string
          description: >-
            пароль пользователя от ЭДО-провайдера, если указано `isDraft
            = true`, то поле не обязательно
        initiatorInn:
          type: string
          description: ИНН инициатора (отправителя)
        initiatorKpp:
          type: string
          description: КПП инициатора (отправителя). Для ИП не указывается
        initiatorOrgId:
          type: string
          description: Идентификатор организации инициатора (отправителя) в Диадок
        initiatorFnsParticipantId:
          type: string
          description: Идентификатор участника электронного документооборота инициатора (отправителя)
        recipientInn:
          type: string
          description: ИНН получателя
        recipientKpp:
          type: string
          description: КПП получателя. Для ИП не указывается
        recipientOrgId:
          type: string
          description: Идентификатор организации получателя в Диадок
        recipientFnsParticipantId:
          type: string
          description: Идентификатор участника электронного документооборота получателя
        thirdPartyInn:
          type: string
          description: ИНН третьей стороны
        thirdPartyKpp:
          type: string
          description: КПП третьей стороны. Для ИП не указывается
        thirdPartyOrgId:
          type: string
          description: Идентификатор треьей стороны в Диадок
        thirdPartyFnsParticipantId:
          type: string
          description: Идентификатор участника электронного документооборота треьей стороны
        isSignedOnPaper:
          type: boolean
          description: значение true означает, что документы подписаны на бумаге. Они не 
            отправляются в Диадок. Если это значение true, то isSignedInOtherEDIProvider не может быть true.
        isSignedInOtherEDIProvider:
          type: boolean
          description: значение true означает, что документы подписан не в Диадоке. Они не 
            отправляются в Диадок. Если это значение true, то isSignedOnPaper не может быть true.
        isDraft:
          type: boolean
          description: >-
            значение true означает, что документы являются черновиками,
            они не отправляются ЭДО-провайдеру
        isUserInitiator:
          type: boolean
          description: >-
            значение true означает, что пользователь указывает себя в
            качестве инициатора (отправителя) документа. В этом случае,
            реквизиты компании пользователя или дочек компании
            пользователя должны совпадать с указанными реквизитами
            отправителя. По умолчанию если реквизиты компании
            пользователя или реквизиты ее дочек совпадают с указанными в
            запросе реквизитами отправители или получателя- по
            умолчанию, пользователь является отправителем или
            получателем соответственно.
        isUserRecipient:
          type: boolean
          description: >-
            значение true означает, что пользователь указывает себя в
            качестве получателя документа. В этом случае, реквизиты
            компании пользователя или дочек компании пользователя должны
            совпадать с указанными реквизитами получателя. По умолчанию
            если реквизиты компании пользователя или реквизиты ее дочек
            совпадают с указанными в запросе реквизитами отправители или
            получателя- по умолчанию, пользователь является отправителем
            или получателем соответственно. Обязательно должно быть
            включено поле `isDraft = true`

    ediStateCreateBySupplier:
      type: object
      description: данные состояния документа в ЭДО после обновления
      properties:
        id:
          type: integer
          format: int64
          description: идентификатор
        ediId:
          type: string
          description: идентификатор документа в ЭДО.
        isFinished:
          type: boolean
          description: >-
            флаг, отвечающий на вопрос: документооборот по этому
            документу завершён?
        signatureStatus:
          type: object
          allOf:
            - $ref: '#/components/requestBodies/ediStateStatus'
          description: >-
            статус подписей документа в ЭДО (см. [Справочник
            статусов подписей
            документа](#edi-state-signature-statuses-refbook)).
        revocationStatus:
          type: object
          allOf:
            - $ref: '#/components/requestBodies/ediStateStatus'
          description: >-
            статус аннулирования документа в ЭДО (см. [Справочник
            статусов аннулирования
            документа](#edi-state-revocation-statuses-refbook)).
        resolutionStatus:
          type: object
          allOf:
            - $ref: '#/components/requestBodies/ediStateStatus'
          description: >-
            статус согласования документа в ЭДО на стороне
            покупателя (см. [Справочник статусов согласования
            документа](#edi-state-resolution-statuses-refbook)).
        signatureDate:
          type: number
          description: >-
            дата подписания документа в ЭДО покупателем. В
            формате *Unix time* или *ISO 8601* (см. [Формат представления
            дат](#date-format)).
        supplierSignatureDate:
          type: number
          description: >-
            дата подписания документа в ЭДО поставщиком. В
            формате *Unix time* или *ISO 8601*(см. [Формат представления
            дат](#date-format)).
        counteragentSignatureDate:
          type: number
          description: дата подписания документа в ЭДО покупателем. В
            формате *Unix time* или *ISO 8601* (см. [Формат представления
            дат](#date-format)).
        direction:
          type: string
          enum:
            - INBOUND
            - OUTBOUND
          description: >-
            направление документа в ЭДО
        offerDocument:
          type: object
          properties:
            id:
              type: integer
              format: int64
              description: идентификатор
          additionalProperties: false
          description: >-
            документ счёта, находящийся в ЭДО, состояние которого
            обновлялось.
        creationDate:
          type: number
          description: >-
            дата создания состояния документа в ЭДО. В формате
            *Unix time* или *ISO 8601* (см. [Формат представления
            дат](#date-format)).
      additionalProperties: false

    offerDocumentItemViewPrice:
      type: object
      properties:
        price:
          type: number
          description: параметр доступен только если пользователь является покупателем. цена за единицу товара. Необходимо право `EDI_STATE_CAN_VIEW_PRICE`
        taxRate:
          type: string
          description: параметр доступен только если пользователь является покупателем. ставка налога. Необходимо право `EDI_STATE_CAN_VIEW_PRICE`
          enum:
            - 'NoVat'
            - 'Percent_0'
            - 'Percent_10'
            - 'Percent_18'
            - 'Percent_20'
            - 'Fraction_10_110'
            - 'Fraction_18_118'
            - 'TaxedByAgent'
        taxRateDesc:
          type: string
          description: параметр доступен только если пользователь является покупателем. локализированное описание ставки налога. Необходимо право `EDI_STATE_CAN_VIEW_PRICE`
        vat:
          type: number
          description: параметр доступен только если пользователь является покупателем. сумма налога. Необходимо право `EDI_STATE_CAN_VIEW_PRICE`
        subtotal:
          type: number
          description: параметр доступен только если пользователь является покупателем. сумма всего. Необходимо право `EDI_STATE_CAN_VIEW_PRICE`

