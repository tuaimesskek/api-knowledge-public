      operationId: >-
        изменить стороны документа
      description: |-
        Меняет стороны еще не отправленного в Диадок ЭДО документа.

        На данный момент поддерживается только изменение третьей стороны, если третья сторона возможна для данного типа документа.
        
        
        __Метод доступен если пользователь__:

        - авторизован;
        
        - имеет доступ к системе;
        
        - состоит в какой-либо компании;
        
        - у пользователя есть право `CUSTOMER_EDI_STATE_REGISTRY` или `SUPPLIER_EDI_STATE_REGISTRY`;

        - имеет доступ к ЭДО-документу с указанным ID.

        - родительский и дочерние документы должны быть еще не отправленными в Диадок

        - компания с указанными ИНН/КПП должна существовать в системе
      tags:
        - ЭДО
      parameters:
        - name: id
          in: path
          description: идентификатор документа
          required: true
          example: '340'
          schema:
            type: integer
            format: int64
        - name: ZakupayToken
          in: header
          description: e.g. <TOKEN_VALUE>
          required: false
          example: <TOKEN_VALUE>
          schema:
            type: string
      requestBody:
