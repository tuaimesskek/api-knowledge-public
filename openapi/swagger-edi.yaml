          in: path
          description: идентификатор документа, которому меняют родительский документ
          required: true
          example: '123'
          schema:
            type: integer
            format: int64
        - name: parentId
          in: path
          description: идентификатор родительского документа
          required: true
          example: '56'
          schema:
            type: boolean
