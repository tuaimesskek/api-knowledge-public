                      - false
                    description: Запрос завершился неудачно.
                  errorMessage:
                    type: string
                    enum:
                      - Фильтр заданный в GET-параметрах некорректен.
                      - HTTP-заголовок "X" не имеет значения.
                    description: Описание ошибки
                required:
                  - result
                  - errorMessage
                additionalProperties: false
              examples:
                response:
                  value:
                    result: false
                    errorMessage: Фильтр заданный в GET-параметрах некорректен
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    enum:
                      - false
                    description: Запрос завершился неудачно.
                  errorMessage:
                    type: string
                    enum:
                      - Неаутентифицированный доступ.
                    description: Описание ошибки
                required:
                  - result
                  - errorMessage
                additionalProperties: false
              examples:
                response:
                  value:
                    result: false
                    errorMessage: Неаутентифицированный доступ.
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    enum:
                      - false
                    description: Запрос завершился неудачно.
                  errorMessage:
                    type: string
                    enum:
                      - Пользователь не определён.
                      - Пользователь не имеет доступа
                      - Пользователь не принадлежит ни одной компании.
                      - >-
                        Пользователь не имеет прав на выполнение запрошенной
                        операции.
                      - Неавторизованный доступ.
                    description: Описание ошибки
                required:
                  - result
                  - errorMessage
                additionalProperties: false
              examples:
                response:
                  value:
                    result: false
                    errorMessage: Пользователь не определён.
        '404':
          description: Not Found
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    enum:
                      - false
                    description: Запрос завершился неудачно.
                  errorMessage:
                    type: string
                    enum:
                      - >-
                        Путь и/или метод обращения к нему не являются валидными
                        в системе.
                    description: Описание ошибки
                required:
                  - result
                  - errorMessage
                additionalProperties: false
              examples:
                response:
                  value:
                    result: false
                    errorMessage: >-
                      Путь и/или метод обращения к нему не являются валидными в
                      системе.
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    enum:
                      - false
                    description: Запрос завершился неудачно.
                  errorMessage:
                    type: string
                    enum:
                      - Ошибка на сервере.
                    description: Описание ошибки
                required:
                  - result
                  - errorMessage
                additionalProperties: false
              examples:
                response:
                  value:
                    result: false
                    errorMessage: Ошибка на сервере.
      summary: Получить реестр состояний ЭДО-документов
      operationId: Получить реестр состояний ЭДО-документов
      description: >-
        Пользователь, пытающийся получить список состояний документов в ЭДО,
        должен иметь право `CUSTOMER_EDI_STATE_REGISTRY` или `SUPPLIER_EDI_STATE_REGISTRY` для работы с реестром
        состояний документов в ЭДО.


        Метод предоставляет возможность запрашивать коллекцию состояний
        документов в ЭДО постранично, контролируя номер и размер запрашиваемой
        страницы. Также доступны различные способы по фильтрации состояний<a
        name="edi-state-update">.</a>
      tags:
        - ЭДО
      parameters:
        - name: page
          in: query
          description: >

            Номер страницы, данные с которой нужно вернуть. Если не задан, то по
            умолчанию будет возвращена первая страница данных.
          required: false
          example: '1'
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          description: >

            Размер страницы. Максимальное значение 100. Если не задано или
            задано некорректно, то будет принято как 10 или 100 в зависимости от
            ситуации.
          required: false
          example: '15'
          schema:
            type: number
            default: 10
        - name: documentType
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            типу документа. Можно указать сразу несколько значений
            *?...documentType=UTD&documentType=TTN...*. Для получения набора
            значений, которые можно указывать в данном фильтре обратитесь к
            методу [справочник типов документа
            счёта](#offer-document-types-refbook).
          required: false
          example: '2'
          schema:
            type: string
        - name: additionalDocumentType
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            типу УПД. В качестве значения параметра указывается **id**
            типа УПД. Можно указать сразу несколько значений
            *?...additionalDocumentType=1&additionalDocumentType=3...*.
          required: false
          example: '1'
          schema:
            type: integer
            format: int64
        - name: updateDateFrom
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по тем, что имеют момент обновления в заданный момент или после него. Значение передавать в формате *ISO 8601* в виде *yyyy-MM-dd hh:mm:ss*. Допустимо указывать только одно значение.
          required: false
          example: '2020-09-17'
          schema:
            type: string
        - name: updateDateTo
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по тем, что имеют момент обновления документа в заданный момент или до него. Значение передавать в формате *ISO 8601* в виде *yyyy-MM-dd hh:mm:ss*. Допустимо указывать только одно значение.
          required: false
          example: '2020-09-19'
          schema:
            type: string
        - name: initiator
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            инимциатору (отправителю). В качестве значения указывается *id* компании инициатора. Можно указать сразу несколько значений  *?...initiator=558&initiator=4992...*.
          required: false
          example: '468'
          schema:
            type: integer
            format: int64
        - name: recipient
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            получателю. В качестве значения указывается *id* компании получателя. Можно указать сразу несколько значений  *?...recipient=45&recipient=98...*.
          required: false
          example: '123'
          schema:
            type: integer
            format: int64
        - name: thirdParty
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            третьей стороне (прокси). В качестве значения указывается *id* компании третьей стороны. Можно указать сразу несколько значений  *?...thirdParty=456&thirdParty=923...*.
          required: false
          example: '75'
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            проекту. В качестве значения указывается *id* проекта. Можно указать сразу несколько значений  *?...project=1&project=7...*.
          required: false
          example: '54'
          schema:
            type: integer
            format: int64
        - name: responsible
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            ответственному по заявке. В качестве значения указывается *id* пользователя. Можно указать сразу несколько значений  *?...responsible=2&responsible=3...*.
          required: false
          example: '64'
          schema:
            type: integer
            format: int64
        - name: ediId
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по ediId. Строгое сравнение
          required: false
          example: '90da34f6-59fa-4c12-b532-8f5126b5io56689d28c9-6301-4dc5-bb11-f36f3e6aved3'
          schema:
            type: string
        - name: state
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            состоянию документа. Можно указать сразу несколько значений
            *?...state=DRAFT&state=SIGNED...*.
          required: false
          example: 'REVOKED'
          schema:
            type: string
            enum:
              - 'DRAFT'
              - 'REVOKED'
              - 'SIGNED'
              - 'WAITING_RECIPIENT_SIGNATURE'
              - 'ACCEPTED'
              - 'REFUSED'
              - 'ON_ACCEPTATION'
              - 'RECEIVED_REVOCATION'
              - 'SENT_REVOCATION'
        - name: currentAcceptor
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО таким образом, чтобы у получаемых состояний документов текущим активным (соответствующего уровня) акцептором являлся кто-то из выбранных. Можно указать сразу несколько значений
            *?...currentAcceptor=23&currentAcceptor=11...*.
          required: false
          example: 23
          schema:
            type: number
        - name: externalId
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по внешнему ID. Можно указать сразу несколько значений *?...externalId=1342&externalId=UTD123...*.
          required: false
          example: '345LRT'
          schema:
            type: string
        - name: regNumber
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по регистрационному номеру документа, находящегося в дополнительных данных инициатора или получателя. Можно указать сразу несколько значений *?...regNumber=1342&regNumber=UTD123...*.
          required: false
          example: 'UTD534'
          schema:
            type: string
        - name: direction
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            направлению. Допустимо указывать только одно значение.
          required: false
          example: 'INBOUND'
          schema:
            type: string
            enum:
              - 'INBOUND'
              - 'OUTBOUND'
        - name: parentDocumentType
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            типу родительских докумнтов. Можно указать сразу несколько значений
            *?...state=WORK_CONTRACT&state=KS3...*.
          required: false
          example: 'WORK_CONTRACT'
          schema:
            type: string
        - name: include
          in: query
          description: >
            Возможность включить в ответ дополнительные данные. Можно указать сразу несколько значений. Значение `parent` включает в ответ информацию о родительском документе.
            Значение `projectHierarchy` включает в ответ иерархию проектов.
          required: false
          example: 'parent'
          schema:
            type: string
            enum:
              - 'parent'
              - 'projectHierarchy'
        - name: offerId
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            счёту документа. В качестве значения параметра указывается **id**
            счёта. Допустимо указывать только одно значение.
          required: false
          example: '3645'
          schema:
            type: number
        - name: orderId
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            заявке, к которой относится счёт документа. В качестве значения
            параметра указывается **id** заявки. Допустимо указывать только одно
            значение.
          required: false
          example: '87451'
          schema:
            type: number
        - name: ttnNumber
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            номеру ТТН. Допустимо указывать только одно значение.
          required: false
          example: 123/23
          schema:
            type: string
        - name: amountFrom
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО,
            сумма которых больше или равна заданной. Принимаются только числовые
            значения. Дробная часть от целой отделяется точкой, а не запятой.
            Можно отправлять целые числа без дробной части. Допустимо указывать
            только одно значение.
          required: false
          example: '5000'
          schema:
            type: number
        - name: amountTo
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО,
            сумма которых меньше или равна заданной. Принимаются только числовые
            значения. Дробная часть от целой отделяется точкой, а не запятой.
            Можно отправлять целые числа без дробной части. Допустимо указывать
            только одно значение.
          required: false
          example: '10000'
          schema:
            type: number
        - name: documentDateFrom
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, что имеют дату документа в заданную дату или после неё.
            Значение передавать в формате *ISO 8601* в виде *yyyy-MM-dd*.
            Допустимо указывать только одно значение.
          required: false
          example: '2016-12-15'
          schema:
            type: string
        - name: initiatorSignatureDateFrom
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
             по тем, что имеют дату подписания инициатора (отправителя) в заданную дату или после неё. Значение передавать в формате *ISO 8601* в виде *yyyy-MM-dd*. Допустимо указывать только одно значение.
          required: false
          example: '2020-09-11'
          schema:
            type: string
        - name: recipientSignatureDateFrom
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
             по тем, что имеют дату подписания получателя в заданную дату или после неё. Значение передавать в формате *ISO 8601* в виде *yyyy-MM-dd*. Допустимо указывать только одно значение.
          required: false
          example: '2020-09-17'
          schema:
            type: string
        - name: recipientSignatureDateTo
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
             по тем, что имеют подпись получателя документа в заданную дату или до неё. Значение передавать в формате *ISO 8601* в виде *yyyy-MM-dd*. Допустимо указывать только одно значение.
          required: false
          example: '2020-09-19'
          schema:
            type: string
        - name: initiatorSignatureDateTo
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
             по тем, что имеют подпись инициатора (отправителя) документа в заданную дату или до неё. Значение передавать в формате *ISO 8601* в виде *yyyy-MM-dd*. Допустимо указывать только одно значение.
          required: false
          example: '2020-09-11'
          schema:
            type: string
        - name: documentDateTo
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, что имеют дату документа в заданную дату или до неё. Значение
            передавать в формате *ISO 8601* в виде *yyyy-MM-dd*. Допустимо
            указывать только одно значение.
          required: false
          example: '2016-12-25'
          schema:
            type: string
        - name: isSigned
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, которые полностью подписаны или не подписаны со стороны отправителя и получателя. Полностью подписанным документ считается, если у него есть подпись отправителя и получателя, или же документ может иметь только подпись получателя и был подпсан получателем. Полностью не подписанным документ считается, если не имеет подпись получателя и отправителя или же может быть подписанным только отправителем и не был подписан отправителем
          required: false
          example: 'true'
          schema:
            type: boolean
        - name: isRejected
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, которым было отказано или не было отказано в подписи получателем или третьей стороной.
          required: false
          example: 'true'
          schema:
            type: boolean
        - name: hasPrintForm
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по тем, у которых нет печатной формы.
          required: false
          example: 'true'
          schema:
            type: boolean
        - name: plain
          in: query
          description: >
            Отвечает на вопрос: Результат запроса должен быть в виде плоского списка без иерархии вложения документов? По умолчанию данные отдаются с иерархией вложения документов.
          required: false
          example: 'false'
          schema:
            type: boolean
        - name: isRevoked
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, которые были или не были аннулированы.
          required: false
          example: 'false'
          schema:
            type: boolean
        - name: onlyDeleted
          in: query
          description: >
            Возможность отфильтровать получаемые состояния документов в ЭДО только по удаленным документам. По умолчанию в выборку не попадают удаленные документы, поэтому фильтр имеет место быть только при значении **true**
          required: false
          example: 'true'
          schema:
            type: boolean
        - name: isDocumentCompletelyMatchWithOffer
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО (**активные УПД**) по
            тем, позиции которых полностью совпадают с позициями счета: по счету есть только один активный УПД, в счете и в документе совпадает количество позиций, по каждой позиции в счете и в документе совпадает количество, единица измерения, наименование. Значение **false** позволяет получить докуметы  (**активные УПД**), не все позиции которых совпадают с позициями счета.
            
            Под **активными УПД** подразумеваются УПД, которые находятся не в статусе "черновик" и без аннулирования.
          required: false
          example: 'true'
          schema:
            type: boolean
            enum:
              - true
        - name: isDocumentCompletelyFromGoodBase
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО (**активные УПД**) по тем, все позиции которых связаны с товарной базой. Значение **false** позволяет получить докуметы  (**активные УПД**), не все позиции которых связаны с товарной базой.
            
            Под **активными УПД** подразумеваются УПД, которые находятся не в статусе "черновик" и без аннулирования.
          required: false
          example: 'true'
          schema:
            type: boolean
            enum:
              - true
        - name: isFinished
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            тем, для которых документооборот был завершён. Фильтр имеет место
            быть только при значении **true**. Значение **false** игнорируется и
            не влияет на выборку.
          required: false
          example: 'true'
          schema:
            type: boolean
            enum:
              - true
        - name: isApplied
          in: query
          description: >

            Возможность отфильтровать получаемые состояния документов в ЭДО по
            статусу приёмки документа. Фильтр имеет место быть при значениях
            **true** - документ был принят, **false** - документ не был принят,
            **null** - документ ещё не принимался. Можно указать сразу несколько
            значений *?...isApplied=false&isApplied=null...*.
          required: false
          example: 'true'
          schema:
            type: boolean
            nullable: true
            enum:
              - true
              - false
              - null
        - name: onlyId
          in: query
          description: >

            Флаг, при котором возвращается только ID сущности, без остальных полей.
            Поддерживаемые парамерты не чувствительны к регистру.
            Можно указать сразу несколько значений *?...onlyId=offer&onlyId=offerorder...*.
          required: false
          example: 'offer'
          schema:
            type: string
            nullable: true
            enum:
              - creator
              - acceptor
              - itemsQuantitiesAcceptor
              - parent
              - accepts
              - acceptsAcceptor
              - offer
              - offerOrder
              - offerOrderProject
              - offerDocument
              - project
              - offerCompanyDocument
        - name: totalCount
          in: query
          description: >
            Возможность получить общее количество элементов коллекции, соответствующей заданному пользоваталем отбору.
          required: false
          example: true
          schema:
            type: boolean
            enum:
              - true
        - name: orderBy
          in: query
          description: >
            Возможность отсортировать состояния документов в ЭДО по указанному параметру в возрастающем порядке. 
            Значение `id` сортирует результирующий список по id документа по возрастанию.
            Значение `amount` сортирует результирующий список по сумме документа по возрастанию.
            Значение `updateTime` сортирует результирующий список по времени последнего обновления документа по возрастанию.
          required: false
          example: amount
          schema:
            type: string
            enum:
              - 'id'
              - 'amount'
              - 'updateTime'
        - name: orderByDesc
          in: query
          description: >
            Возможность отсортировать состояния документов в ЭДО по указанному параметру в убывающем порядке.
            Значение `id` сортирует результирующий список по id документа по убыванию.
            Значение `amount` сортирует результирующий список по сумме документа по убыванию.
            Значение `updateTime` сортирует результирующий список по времени последнего обновления документа по убыванию.
          required: false
          example: amount
          schema:
            type: string
            enum:
              - 'id'
              - 'amount'
              - 'updateTime'
        - name: ZakupayToken
          in: header
          description: e.g. TOKEN_VALUE
          required: false
          example: TOKEN_VALUE
          schema:
            type: string
