      summary: >-
        Восстановить удаленный ЭДО-документ
      operationId: >-
        Восстановить удаленный ЭДО-документ
      description: |-
        Восстанавливает удаленный документ. Если у документа есть удаленные дочерние - они тоже восстанавливаются. При наличии права `EDI_STATE_CAN_VIEW_PRICE` в ответе вернется информация по ценам документа
        
        __Восстановить документ можно если__:
        
        - у пользователя есть право `EDI_RESTORE`
        
        - документ с указанным идентификатором должен существовать
        
        - восстанавливаемый документ должен иметь подходящий статус (удален)
        
        - пользователь находится в иерархии компании создателя документа
        
        - у восстанавливаемого документа нет родительского или он (родительский) не удален 
      

      tags:
        - ЭДО
      parameters:
        - name: ediStateId
          in: path
          description: идентификатор документа, который хотят восстановить
          required: true
          example: '340'
          schema:
            type: integer
            format: int64
        - name: ZakupayToken
          in: header
          description: e.g. <TOKEN_VALUE>
          required: true
          example: <TOKEN_VALUE>
          schema:
            type: string

