      description: |-
        Изменяет или удаляет внешний id ЭДО-документа. 

        __Метод доступен если__:
        пользователь

          - авторизован,


          - имеет доступ к системе,
        
        
          - состоит в какой-либо компании,


          - имеет разрешение `CUSTOMER_EDI_STATE_REGISTRY` или `SUPPLIER_EDI_STATE_REGISTRY`,
        
        
          - имеет доступ к ЭДО-документу с указанным ID
        
        
          - из компании отправителя (может входить в ту же иерархию компаний, что и третья сторона) или получателя (третья сторона не поддерживается)

      tags:
